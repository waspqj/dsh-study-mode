# awesome-dsh-plugin 目录收录投稿文件
#
# 用法：把本文件的内容复制到
#   https://github.com/awesome-dsh-plugin/awesome-dsh-plugin/pull/new/master
#   新建文件路径：data/plugins/<github用户名>__dsh-study-mode.yml
# 一个插件一个文件（条目文件永不相撞，所以你的 PR 不会和别人冲突）。
#
# 目录规则要点（来自 awesome-dsh-plugin/contributing.md）：
#   - url 必须**精确**指向你的 GitHub 仓库（目录 7211 条全是 github.com，
#     CI 用 GitHub API 枚举仓库树，别的托管平台过不了）
#   - package.json 里要声明 dsh.bundle（已有 ✓），仓库根要有 cordis.patch.yml（已有 ✓）
#   - 仓库要满 1 天（CI 自动查 GitHub 仓库的 created_at；PR 可以先提，
#     时间到了 CI 自己重跑就过）
#   - 仓库要加 dsh-plugin topic
#   - 只有 description.en 必填；中文写不了可以留空，维护者会补
#   - 描述只说功能、不带营销词，而且必须属实（会被拿代码核对）
#   - category 选最贴近的就行，选不准维护者会自己改，不会打回
#
# 改完把下面 <GITHUB_USER> 换成你的 GitHub 用户名。

url: https://github.com/<GITHUB_USER>/dsh-study-mode
name: <GITHUB_USER>/dsh-study-mode
category: memory
description:
  en: 'Learning-mode agent preset for DSH with a topic knowledge base: answers retrieve from your own stored cards and cite the card they came from, mark anything not found as unverified, and only go online when verification is required. The sidebar panel browses topics, searches and edits cards, and every card can be AI-reviewed, verified, rolled back and versioned. Cards can reference each other with [[title]] links; the panel shows both outgoing links and which cards reference the one you are reading. New cards arrive as a preview you confirm before they enter the library; topic and card names are editable in the UI. The knowledge base is plain local files, not an automatic scraper.'
  zh: '学习模式 agent 预设 + 主题知识库：回答先从你自己存的卡片里检索，命中就标出处，查不到标「未验证」，必须查证才联网；侧边栏面板按主题浏览、搜索、编辑卡片，每张卡可 AI 校验补充、核实、回退和看版本；卡片之间可以用 [[标题]] 互链，面板里能看到「它连着谁」和「谁引用了它」；新卡片先出预览，确认后才入库；主题名和卡片名都能在界面里改。知识库是本地普通文件，不做后台自动抓取。'
icon: https://raw.githubusercontent.com/<GITHUB_USER>/dsh-study-mode/main/assets/icon-180.png
